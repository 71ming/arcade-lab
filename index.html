<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一个包含多种轻量小游戏的小游戏合集。">
<title>小游戏合集 · Arcade Lab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%239ee9ff'/%3E%3Cpath d='M18 26h28v20H18z' fill='%230b1230'/%3E%3Cpath d='M25 22v8M21 26h8M43 28h.1M48 34h.1' stroke='%239ee9ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#070b20;--surface:#101735;--surface2:#151e43;--line:rgba(174,195,255,.16);--ink:#f3f6ff;--muted:#9ca9ce;--blue:#9ee9ff;--violet:#bba8ff;--green:#69e0a5;--danger:#ff859d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 80% -10%,#2a3e83 0,#11183d 30%,var(--bg) 72%)}button,input{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:rgba(7,11,32,.74);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px}.brand-mark{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:var(--blue);color:#07112e;font-size:22px}.brand strong{display:block;font-size:17px;letter-spacing:-.03em}.brand small{color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{border:0;text-align:left;padding:12px 13px;border-radius:12px;color:var(--muted);background:transparent}.nav button:hover,.nav button.active{color:var(--ink);background:var(--surface2)}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.side-note{margin-top:auto;padding:15px;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:12px;line-height:1.65;background:rgba(16,23,53,.6)}
.main{width:min(1220px,100%);padding:29px clamp(20px,4vw,55px) 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.crumb{color:var(--muted);font-size:14px}.top-actions{display:flex;gap:9px}.ghost{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted);background:rgba(16,23,53,.65)}.ghost:hover{color:var(--ink);border-color:rgba(174,195,255,.4)}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;align-items:stretch;margin-bottom:24px}.hero-main,.hero-side{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(36,56,123,.58),rgba(15,21,55,.72));box-shadow:0 22px 60px rgba(0,0,0,.2)}.hero-main{padding:30px;min-height:245px;position:relative;overflow:hidden}.hero-main:after{content:"✦  ✧  ✦";position:absolute;right:22px;bottom:21px;font-size:55px;letter-spacing:13px;color:rgba(158,233,255,.15);transform:rotate(-11deg)}h1{font-size:clamp(34px,5vw,60px);letter-spacing:-.08em;line-height:.96;margin:0 0 14px;max-width:520px}.hero-main p{color:#bcc7e6;line-height:1.7;max-width:550px;margin:0 0 22px}.primary{border:0;border-radius:999px;background:var(--blue);color:#07112e;padding:12px 18px;font-weight:850;box-shadow:0 7px 25px rgba(84,206,255,.2)}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.hero-side{padding:23px}.hero-side h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 17px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:16px;background:rgba(7,11,32,.35);border:1px solid rgba(174,195,255,.1)}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:28px;margin-top:3px;display:block}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 13px}.section-head h2{margin:0;font-size:20px;letter-spacing:-.04em}.section-head span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{min-height:145px;padding:17px;border:1px solid var(--line);border-radius:19px;background:rgba(16,23,53,.74);transition:.18s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:rgba(158,233,255,.55);background:rgba(23,34,76,.8)}.card .emoji{font-size:27px}.card h3{margin:13px 0 5px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.tag{display:inline-flex;margin-top:14px;padding:4px 8px;border-radius:999px;background:rgba(158,233,255,.1);color:var(--blue);font-size:11px}.game-view{display:none}.game-view.visible{display:block}.game-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.game-head h1{font-size:clamp(30px,5vw,50px);margin:0 0 7px}.game-head p{margin:0;color:var(--muted)}.game-wrap{border:1px solid var(--line);border-radius:25px;background:rgba(16,23,53,.74);padding:20px;min-height:490px}.game-grid{display:grid;grid-template-columns:1fr 250px;gap:16px}.game-panel{border:1px solid var(--line);border-radius:20px;background:rgba(7,11,32,.3);padding:18px}.game-panel h3{margin:0 0 14px;font-size:14px;color:var(--muted);font-weight:600}.mini-stat{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(174,195,255,.1);color:var(--muted);font-size:13px}.mini-stat:last-child{border-bottom:0}.mini-stat b{color:var(--ink);font-size:22px}.game-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.secondary{border:1px solid var(--line);border-radius:999px;padding:10px 15px;background:var(--surface2);color:var(--ink)}.secondary:hover{border-color:rgba(158,233,255,.55)}.note{color:var(--muted);font-size:12px;line-height:1.7}.hide{display:none!important}
.cps-pad,.reaction-pad{min-height:390px;display:grid;place-items:center;border-radius:18px;text-align:center;background:linear-gradient(145deg,#214e97,#27357e);cursor:pointer;user-select:none;touch-action:manipulation}.cps-pad:active{transform:scale(.995)}.cps-big{font-size:92px;line-height:.85;font-weight:900;letter-spacing:-.09em}.muted{color:var(--muted)}.mode-row{display:flex;gap:7px;margin-bottom:14px}.mode{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:transparent;color:var(--muted)}.mode.active,.mode:hover{background:var(--blue);color:#07112e;border-color:transparent}
.reaction-pad{background:#203061}.reaction-pad.wait{background:#ae3b5b}.reaction-pad.go{background:#2daa72}.reaction-pad.too{background:#c14963}.reaction-icon{font-size:57px}.reaction-pad h2{margin:13px 0 7px}.reaction-pad p{margin:0;color:rgba(255,255,255,.75);line-height:1.6}
.memory-board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:460px;margin:auto}.memory-card{aspect-ratio:1;border:0;border-radius:14px;background:#212d64;color:transparent;font-size:27px;transition:.16s}.memory-card.show,.memory-card.done{background:linear-gradient(135deg,#83ddff,#8e99ff);color:#091332}.memory-card.done{background:#4dca91}.memory-card.bad{background:#ff6883}.memory-card:not(:disabled):hover{transform:translateY(-2px);border:1px solid var(--blue)}
.type-quote{padding:18px;border-radius:15px;background:#0b1130;color:#d9e1ff;font-size:19px;line-height:1.8;margin-bottom:14px}.type-quote .correct{color:var(--green)}.type-quote .wrong{color:var(--danger);text-decoration:underline}.typing-input{width:100%;min-height:106px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--ink);background:#0a1030;outline:0}.typing-input:focus{border-color:var(--blue)}
.rhythm-pad{min-height:290px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#242e72,#3d267b);position:relative;overflow:hidden}.rhythm-pad:before{content:"";position:absolute;inset:45% 0 auto;height:2px;background:rgba(255,255,255,.22)}.rhythm-target{width:110px;height:110px;border-radius:50%;border:3px solid var(--blue);display:grid;place-items:center;font-size:30px;z-index:1;box-shadow:0 0 45px rgba(158,233,255,.25)}.beat-pulse{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--blue);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 25px var(--blue);opacity:0}
canvas{display:block;width:100%;height:auto;border-radius:15px;background:#0a1030}.canvas-wrap{position:relative}.canvas-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.maze{display:grid;grid-template-columns:repeat(15,1fr);max-width:600px;margin:auto;border:5px solid #26346c}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(10px,2.5vw,22px)}.wall{background:#111a45}.floor{background:#0d1434}.player{background:#4f7fff}.exit{background:#4cd39a}.maze-controls{display:grid;grid-template-columns:repeat(3,44px);gap:6px;justify-content:center;margin-top:14px}.maze-controls button{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink)}.maze-controls button:nth-child(1){grid-column:2}
.grid2048{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:455px;margin:auto;padding:9px;border-radius:15px;background:#273364;touch-action:none;user-select:none}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:#17204a;font-size:clamp(20px,5vw,34px);font-weight:900}.t2{background:#c7d7ff;color:#101b4a}.t4{background:#9dbbff;color:#101b4a}.t8{background:#72a4ff}.t16{background:#8c83ff}.t32{background:#bb82ff}.t64{background:#ed83bd}.t128{background:#ffae70}.t256{background:#ffcc68}.t512,.t1024,.t2048{background:#6ee0ab;color:#09233a}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--ink);background:var(--surface2)}.choice:hover{border-color:var(--blue)}.choice.correct{background:rgba(71,199,136,.25);border-color:var(--green)}.choice.wrong{background:rgba(255,83,119,.2);border-color:var(--danger)}.quiz-emoji{font-size:54px;margin-bottom:13px}
.pet-card{text-align:center;max-width:520px;margin:auto}.pet{font-size:100px;line-height:1;filter:drop-shadow(0 0 25px rgba(158,233,255,.2))}.meter{margin:13px 0;text-align:left}.meter-line{height:11px;border-radius:99px;background:#202956;overflow:hidden}.meter-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff8d9f,#ffd469,#6ce0a5);transition:.25s}.pet-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:17px}
.story{max-width:650px;margin:auto}.story-text{font-size:21px;line-height:1.8;padding:22px;border-radius:17px;background:#0b1130;margin-bottom:15px}.story-choice{display:block;width:100%;margin:9px 0;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);background:var(--surface2)}.story-choice:hover{border-color:var(--violet);background:#222b60}
@media(max-width:980px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.game-grid{grid-template-columns:1fr}.game-grid aside{display:grid;grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.side{position:static;height:auto;padding:13px 15px;display:block;border-right:0;border-bottom:1px solid var(--line)}.brand{display:inline-flex}.nav{display:flex;overflow:auto;margin-top:13px}.nav button{white-space:nowrap}.side-note{display:none}.main{padding:20px 15px 30px}.topbar{margin-bottom:18px}.hero-main{padding:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.game-head{display:block}.game-head .ghost{margin-top:13px}.game-wrap{padding:13px}.game-grid aside{display:block}.game-panel{padding:13px}.choice-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">✦</div><div><strong>Arcade Lab</strong><small>小游戏合集</small></div></div>
    <nav class="nav" id="nav">
      <button class="active" data-view="home">⌂　全部游戏</button>
      <button data-view="tests">⚡　速度测试</button>
      <button data-view="brain">◈　脑力挑战</button>
      <button data-view="chill">☾　轻松玩</button>
    </nav>
    <div class="side-note">选择一个游戏就能直接开始。你的最佳成绩会保存在这台设备上。</div>
  </aside>
  <main class="main">
    <div class="topbar"><div class="crumb" id="crumb">全部游戏 / 首页</div><div class="top-actions"><button class="ghost" id="homeBtn">回到首页</button></div></div>
    <section id="homeView">
      <div class="hero">
        <div class="hero-main"><h1>今天，玩点<br><span style="color:var(--blue)">小而好玩</span>的。</h1><p>从手速、记忆到迷宫和故事冒险，挑一个喜欢的，马上开始。</p><button class="primary" id="featuredBtn">开始随机游戏　→</button></div>
        <div class="hero-side"><h2>你的游玩记录</h2><div class="stat-grid"><div class="stat"><span>已玩游戏</span><b id="playedCount">0</b></div><div class="stat"><span>最高 CPS</span><b id="homeCps">—</b></div><div class="stat"><span>最佳反应</span><b id="homeReaction">—</b></div><div class="stat"><span>合集数量</span><b>11</b></div></div></div>
      </div>
      <div class="section-head"><h2>全部游戏</h2><span>11 个可玩的小游戏</span></div>
      <div class="cards" id="cards"></div>
    </section>
    <section class="game-view" id="gameView">
      <div class="game-head"><div><h1 id="gameTitle"></h1><p id="gameDesc"></p></div><button class="ghost" id="backBtn">← 返回合集</button></div>
      <div class="game-wrap" id="gameStage"></div>
    </section>
  </main>
</div>
<script>
const games=[
 {id:'cps',icon:'🖱️',title:'CPS 点击测试',desc:'看看你一秒能点击多少次。',group:'tests',tag:'手速'},
 {id:'reaction',icon:'⚡',title:'反应速度',desc:'看到绿色，马上点击。',group:'tests',tag:'手速'},
 {id:'memory',icon:'🧠',title:'记忆方块',desc:'记住顺序，逐关挑战。',group:'brain',tag:'记忆'},
 {id:'typing',icon:'⌨️',title:'打字挑战',desc:'30 秒内打得又快又准。',group:'tests',tag:'输入'},
 {id:'rhythm',icon:'🎵',title:'节奏点击',desc:'踩准节拍，连击得分。',group:'tests',tag:'节奏'},
 {id:'dodge',icon:'🚀',title:'星际躲避',desc:'左右移动，躲开落下的陨石。',group:'chill',tag:'动作'},
 {id:'maze',icon:'🧭',title:'迷宫出口',desc:'找到出口，挑战最短时间。',group:'brain',tag:'解谜'},
 {id:'2048',icon:'🔢',title:'数字合成',desc:'滑动方块，合成 2048。',group:'brain',tag:'经典'},
 {id:'quiz',icon:'🎯',title:'猜词挑战',desc:'根据提示选出正确答案。',group:'brain',tag:'问答'},
 {id:'pet',icon:'🐣',title:'虚拟宠物',desc:'照顾一只属于你的电子小伙伴。',group:'chill',tag:'养成'},
 {id:'story',icon:'📖',title:'分支故事',desc:'你的选择决定故事走向。',group:'chill',tag:'冒险'}
];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let active='home';
function markPlayed(id){const played=JSON.parse(localStorage.getItem('arcade-played')||'[]');if(!played.includes(id)){played.push(id);localStorage.setItem('arcade-played',JSON.stringify(played));}updateHomeStats();}
function updateHomeStats(){const played=JSON.parse(localStorage.getItem('arcade-played')||'[]');$('#playedCount').textContent=played.length;const c=Number(localStorage.getItem('arcade-cps-best-5')||0),r=Number(localStorage.getItem('arcade-reaction-best')||0);$('#homeCps').textContent=c?c.toFixed(1):'—';$('#homeReaction').textContent=r?r+'ms':'—';}
function renderCards(){const host=$('#cards');host.innerHTML=games.map(g=>'<article class="card" data-game="'+g.id+'"><div class="emoji">'+g.icon+'</div><h3>'+g.title+'</h3><p>'+g.desc+'</p><span class="tag">'+g.tag+'</span></article>').join('');$$('[data-game]').forEach(c=>c.onclick=()=>openGame(c.dataset.game));}
function showHome(){active='home';$('#homeView').style.display='block';$('#gameView').classList.remove('visible');$('#crumb').textContent='全部游戏 / 首页';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='home'));updateHomeStats();}
function openGame(id){const g=games.find(x=>x.id===id);if(!g)return;active=id;markPlayed(id);$('#homeView').style.display='none';$('#gameView').classList.add('visible');$('#gameTitle').textContent=g.icon+' '+g.title;$('#gameDesc').textContent=g.desc;$('#crumb').textContent='小游戏 / '+g.title;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===g.group));const stage=$('#gameStage');stage.innerHTML='';const fn=modules[id];if(fn)fn(stage);}
function filterGroup(group){if(group==='home'){showHome();return}$('#homeView').style.display='block';$('#gameView').classList.remove('visible');$('#crumb').textContent='小游戏 / '+({tests:'速度测试',brain:'脑力挑战',chill:'轻松玩'}[group]||'全部游戏');$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===group));$('#cards').innerHTML=games.filter(g=>g.group===group).map(g=>'<article class="card" data-game="'+g.id+'"><div class="emoji">'+g.icon+'</div><h3>'+g.title+'</h3><p>'+g.desc+'</p><span class="tag">'+g.tag+'</span></article>').join('');$$('[data-game]').forEach(c=>c.onclick=()=>openGame(c.dataset.game));}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)filterGroup(b.dataset.view)});$('#homeBtn').onclick=showHome;$('#backBtn').onclick=showHome;$('#featuredBtn').onclick=()=>openGame(games[Math.floor(Math.random()*games.length)].id);
const modules={};
modules.cps=host=>{
 host.innerHTML='<div class="game-grid"><div class="game-panel"><div class="mode-row"><button class="mode" data-s="1">1 秒</button><button class="mode active" data-s="5">5 秒</button><button class="mode" data-s="10">10 秒</button></div><div class="cps-pad" id="cpsPad"><div><div class="cps-big" id="cpsMain">—</div><div class="muted" id="cpsLabel">点击开始，然后疯狂点击这里</div><button class="primary" id="cpsStart">开始测试</button></div></div></div><aside><div class="game-panel"><h3>本次成绩</h3><div class="mini-stat"><span>点击次数</span><b id="cpsClicks">0</b></div><div class="mini-stat"><span>剩余时间</span><b id="cpsTime">5.0s</b></div><div class="mini-stat"><span>当前 CPS</span><b id="cpsScore">0.00</b></div></div><div class="game-panel"><h3>最佳成绩</h3><div class="mini-stat"><span>5 秒最佳</span><b id="cpsBest">—</b></div><p class="note">手指或鼠标都可以。保持稳定节奏，比一味乱点更容易拿高分。</p></div></aside></div>';
 let duration=5,run=false,clicks=0,t0=0,tm,raf;const pad=$('#cpsPad'),start=$('#cpsStart');
 const best=()=>Number(localStorage.getItem('arcade-cps-best-'+duration)||0);
 function read(){const b=best();$('#cpsBest').textContent=b?b.toFixed(2):'—';}
 function finish(){if(!run)return;if(!host.querySelector('#cpsPad')){run=false;return;}run=false;cancelAnimationFrame(raf);clearTimeout(tm);const score=clicks/duration;pad.style.background='linear-gradient(145deg,#285d97,#3c347f)';$('#cpsMain').textContent=score.toFixed(2);$('#cpsLabel').textContent=score>8?'手速爆发！':'CPS · 点击重新测试';start.style.display='inline-block';start.textContent='再测一次';$('#cpsScore').textContent=score.toFixed(2);$('#cpsTime').textContent='0.0s';if(score>best())localStorage.setItem('arcade-cps-best-'+duration,score.toFixed(2));read();}
 function tick(){if(!run)return;if(!host.querySelector('#cpsPad')){run=false;return;}const left=Math.max(0,duration*1000-(performance.now()-t0));$('#cpsTime').textContent=(left/1000).toFixed(1)+'s';$('#cpsScore').textContent=(clicks/Math.max((performance.now()-t0)/1000,.001)).toFixed(2);if(left>0)raf=requestAnimationFrame(tick);}
 function begin(e){e.stopPropagation();run=true;clicks=0;t0=performance.now();pad.style.background='linear-gradient(145deg,#285d97,#334bb0)';$('#cpsMain').textContent='0';$('#cpsLabel').textContent='疯狂点击蓝色区域！';start.style.display='none';$('#cpsClicks').textContent=0;tick();tm=setTimeout(finish,duration*1000);}
 pad.addEventListener('pointerdown',e=>{if(run&&!e.target.closest('button')){clicks++;$('#cpsClicks').textContent=clicks;$('#cpsMain').textContent=clicks;}});start.onclick=begin;$$('.mode').forEach(b=>b.onclick=()=>{if(!run){duration=Number(b.dataset.s);$$('.mode').forEach(x=>x.classList.toggle('active',x===b));$('#cpsTime').textContent=duration.toFixed(1)+'s';read();}});read();
};
modules.reaction=host=>{
